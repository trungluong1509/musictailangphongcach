
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nghe nhạc cùng tôi</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #edf2f8;
      color: #20334b;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 28px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 30px #17365a1c;
      text-align: center;
    }

    header {
      margin: -28px -28px 26px;
      padding: 28px 18px;
      border-radius: 18px 18px 0 0;
      background: #17365a;
      color: white;
    }

    h1 { margin: 0 0 10px; font-size: 27px; }
    .message { font-size: 18px; line-height: 1.7; }
    .note { margin-top: 18px; color: #68788b; font-size: 13px; }

    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>TRANG THÔNG TIN</h1>
      <div>Thông điệp và âm nhạc</div>
    </header>

    <div class="message">
      Chào mừng bạn đến với trang web của tôi!
    </div>

    <h2>Bản nhạc của tôi 🎵</h2>

    <iframe
      src="https://www.youtube-nocookie.com/embed/MjE3Yxrv5NY"
      title="Trình phát nhạc YouTube"
      allow="encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

    <div class="note">
      Nhấn nút phát trên trình phát để nghe nhạc.
    </div>
  </main>
</body>
</html>
